<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODEMSO | Terminal Login</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --box-bg: #ffffff;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      border-radius: 0 !important;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      font-size: 0.72rem;
    }

    .login-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 280px;
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
    }

    .login-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 14px;
      gap: 10px;
    }

    .login-logo {
      height: 42px;
      width: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .brand-name {
      font-weight: 700;
      font-size: 0.92rem;
      letter-spacing: 0.5px;
      color: var(--text-color);
    }

    .brand-sub {
      color: #0284c7;
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: block;
      margin-top: 2px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.58rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      background-color: var(--box-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 8px;
      font-size: 0.72rem;
      font-weight: 400;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: #0284c7;
    }

    .btn-login {
      background-color: var(--accent-color);
      color: #ffffff;
      border: 1px solid var(--accent-hover);
      padding: 7px 12px;
      font-size: 0.68rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      margin-top: 4px;
      transition: background-color 0.2s;
    }

    .btn-login:hover {
      background-color: var(--accent-hover);
    }

    .error-msg {
      color: var(--danger-color);
      font-size: 0.60rem;
      font-weight: 500;
      display: none;
      text-align: center;
      background-color: #fef2f2;
      padding: 5px;
      border: 1px solid #fecaca;
    }

    .footer-info {
      font-size: 0.55rem;
      color: var(--text-muted);
      text-align: center;
      font-family: monospace;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <img src="https://i.hizliresim.com/mes685t.png" alt="Logo" class="login-logo" oncontextmenu="return false;">
      <div>
        <div class="brand-name">CODEMSO</div>
        <span class="brand-sub">TERMINAL ACCESS PORTAL</span>
      </div>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group" style="margin-bottom: 10px;">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter username" required autocomplete="username">
      </div>

      <div class="form-group" style="margin-bottom: 10px;">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
      </div>

      <div id="error-msg" class="error-msg">Invalid username or password.</div>

      <button type="submit" class="btn-login">LOGIN</button>
    </form>

    <div class="footer-info">
      v2.5.0 | Mehmet Salih OK
    </div>
  </div>

  <script>
    const VALID_USERNAME = "salih";
    const VALID_PASSWORD = "123";

    // Tarayıcıda oturum kayıtlıysa doğrudan terminale geç
    if (localStorage.getItem('codemso_auth') === 'true') {
      window.location.href = 'rsi.html';
    }

    function handleLogin(e) {
      e.preventDefault();

      const userInput = document.getElementById('username').value.trim();
      const passInput = document.getElementById('password').value.trim();
      const errorEl = document.getElementById('error-msg');

      if (userInput === VALID_USERNAME && passInput === VALID_PASSWORD) {
        localStorage.setItem('codemso_auth', 'true');
        errorEl.style.display = 'none';
        window.location.href = 'rsi.html';
      } else {
        errorEl.style.display = 'block';
        document.getElementById('password').value = '';
      }
    }
  </script>
</body>
</html>
