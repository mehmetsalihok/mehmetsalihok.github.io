<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODEMSO | Terminal Giriş</title>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --box-bg: #0f172a;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      border-radius: 0 !important;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      font-size: 0.75rem;
    }

    .login-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 340px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .login-header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .brand-name {
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 1px;
      color: var(--text-color);
    }

    .brand-sub {
      color: #38bdf8;
      font-size: 0.65rem;
      font-weight: 600;
      margin-top: 4px;
      display: block;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      background-color: var(--box-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: #38bdf8;
    }

    .btn-login {
      background-color: var(--accent-color);
      color: #ffffff;
      border: 1px solid var(--accent-hover);
      padding: 9px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.5px;
      margin-top: 4px;
      transition: background-color 0.2s;
    }

    .btn-login:hover {
      background-color: var(--accent-hover);
    }

    .error-msg {
      color: var(--danger-color);
      font-size: 0.65rem;
      font-weight: 700;
      display: none;
      text-align: center;
      background-color: rgba(239, 68, 68, 0.1);
      padding: 6px;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .footer-info {
      font-size: 0.58rem;
      color: var(--text-muted);
      text-align: center;
      font-family: monospace;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <div class="brand-name">CODEMSO</div>
      <span class="brand-sub">TERMINAL ERİŞİM PORTALI</span>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group" style="margin-bottom: 12px;">
        <label for="username">Kullanıcı Adı</label>
        <input type="text" id="username" class="form-control" placeholder="Kullanıcı adınızı girin" required autocomplete="username">
      </div>

      <div class="form-group" style="margin-bottom: 12px;">
        <label for="password">Şifre</label>
        <input type="password" id="password" class="form-control" placeholder="Şifrenizi girin" required autocomplete="current-password">
      </div>

      <div id="error-msg" class="error-msg">Kullanıcı adı veya şifre hatalı!</div>

      <button type="submit" class="btn-login">GİRİŞ YAP</button>
    </form>

    <div class="footer-info">
      v2.5.0 | Mehmet Salih OK
    </div>
  </div>

  <script>
    // ==========================================
    // GİRİŞ BİLGİLERİNİ BURADAN DEĞİŞTİREBİLİRSİNİZ
    // ==========================================
    const VALID_USERNAME = "salih";
    const VALID_PASSWORD = "123";

    // Oturum önceden açıldıysa direkt yönlendir
    if (sessionStorage.getItem('codemso_auth') === 'true') {
      window.location.href = 'rsi.html';
    }

    function handleLogin(e) {
      e.preventDefault();

      const userInput = document.getElementById('username').value.trim();
      const passInput = document.getElementById('password').value.trim();
      const errorEl = document.getElementById('error-msg');

      if (userInput === VALID_USERNAME && passInput === VALID_PASSWORD) {
        sessionStorage.setItem('codemso_auth', 'true');
        errorEl.style.display = 'none';
        window.location.href = 'rsi.html';
      } else {
        errorEl.style.display = 'block';
        document.getElementById('password').value = '';
      }
    }
  </script>
</body>
</html>
