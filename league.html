        function addCoin(coin) {

        function stepProfit(delta) {

        function stepCapMultiplier(delta) {
            const next = LEAGUE_STATE.capMultiplier + delta;
            if (next >= 1 && next <= 30) {
                LEAGUE_STATE.capMultiplier = next;

                document.getElementById('txtMonthlyCap').textContent = `%${getMonthlyCap().toFixed(1)}`;
            }
        }

        // --- MATEMATİK & RSI MOTORU ---
        function calculateRSIHistory(prices, period = 14) {
            const rsiValues = new Array(prices.length).fill(null);
            if (prices.length <= period) return rsiValues;

            let gains = 0, losses = 0;
            for (let i = 1; i <= period; i++) {
                const diff = prices[i] - prices[i - 1];
                if (diff >= 0) gains += diff; else losses += Math.abs(diff);
            }

            let avgGain = gains / period;
            let avgLoss = losses / period;
            rsiValues[period] = avgLoss === 0 ? 100.0 : 100.0 - (100.0 / (1.0 + avgGain / avgLoss));

            for (let i = period + 1; i < prices.length; i++) {
                const diff = prices[i] - prices[i - 1];
                const gain = diff >= 0 ? diff : 0;
                const loss = diff < 0 ? Math.abs(diff) : 0;

                avgGain = (avgGain * (period - 1) + gain) / period;
                avgLoss = (avgLoss * (period - 1) + loss) / period;

                if (avgLoss === 0) {
                    rsiValues[i] = 100.0;
                } else {
                    const rs = avgGain / avgLoss;
                    rsiValues[i] = 100.0 - (100.0 / (1.0 + rs));
                }
            }
            return rsiValues;
        }

        async function fetchAllCandlesSince2026(symbol, interval) {
            const startTime = new Date('2026-01-01T00:00:00Z').getTime();
            const endTime = Date.now();
            let allCandles = [];
            let currentStart = startTime;

            while (currentStart < endTime) {
                const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&startTime=${currentStart}&endTime=${endTime}&limit=1000`;
                const res = await fetch(url);
                if (!res.ok) break;
                const batch = await res.json();
                if (!batch || batch.length === 0) break;

                const mapped = batch.map(item => ({
                    time: item[0],
                    open: parseFloat(item[1]),
                    high: parseFloat(item[2]),
                    low: parseFloat(item[3]),
                    close: parseFloat(item[4]),
                    monthKey: new Date(item[0]).toISOString().slice(0, 7),
                    day: new Date(item[0]).getDate()
                }));

                allCandles.push(...mapped);
                if (batch.length < 1000) break;
                currentStart = batch[batch.length - 1][0] + 1;
            }
            return allCandles;
        }

        // Tekil Konfigürasyon Simülatörü (Aylık Kilit Gün Analiziyle Birlikte)
        function simulateSingleConfig(candles, rsiLength, buyRsi, sellRsi, profitTarget, monthlyCap) {
            const closePrices = candles.map(c => c.close);
            const rsiVals = calculateRSIHistory(closePrices, rsiLength);
            
            let inPos = false, entryP = 0, entryT = 0;
            let totPnl = 0, winCount = 0, totalTrades = 0;
            let totalHoldSeconds = 0;
            let monthlyMap = {};
            const trades = [];

            for (let i = rsiLength + 1; i < candles.length; i++) {
                const c = candles[i];
                const rsi = rsiVals[i];
                const prevRsi = rsiVals[i - 1];
                if (rsi === null || prevRsi === null) continue;

                const mKey = c.monthKey;
                if (!monthlyMap[mKey]) {
                    monthlyMap[mKey] = {
                        monthKey: mKey,
                        firstTradeDay: c.day,
                        lockDay: null,
                        daysToLock: null,
                        totalMonthPnl: 0,
                        isLocked: false
                    };
                }

                const isCapReached = (monthlyMap[mKey].totalMonthPnl + 0.001) >= monthlyCap;

                if (!inPos && !isCapReached) {
                    if (prevRsi <= buyRsi && rsi > buyRsi) {
                        inPos = true;
                        entryP = c.close;
                        entryT = c.time;
                    }
                } else if (inPos) {
                    const targetP = entryP * (1.0 + profitTarget / 100.0);
                    let exited = false, pnl = 0;

                    if (c.high >= targetP) {
                        exited = true;
                        pnl = profitTarget;
                    } else if (rsi >= sellRsi) {
                        exited = true;
                        pnl = ((c.close - entryP) / entryP) * 100.0;
                    }

                    if (exited) {
                        inPos = false;
                        totalTrades++;
                        if (pnl >= 0) winCount++;
                        totPnl += pnl;

                        monthlyMap[mKey].totalMonthPnl += pnl;
                        if ((monthlyMap[mKey].totalMonthPnl + 0.001) >= monthlyCap && !monthlyMap[mKey].isLocked) {
                            monthlyMap[mKey].isLocked = true;
                            monthlyMap[mKey].lockDay = c.day;
                            monthlyMap[mKey].daysToLock = Math.max(1, c.day - monthlyMap[mKey].firstTradeDay + 1);
                        }

                        const diffSec = Math.max(0, Math.floor((c.time - entryT) / 1000));
                        totalHoldSeconds += diffSec;
                    }
                }
            }

            const winRateVal = totalTrades > 0 ? (winCount / totalTrades) * 100.0 : 0.0;
            const avgSec = totalTrades > 0 ? Math.floor(totalHoldSeconds / totalTrades) : 0;
            const avgH = Math.floor(avgSec / 3600);
            const avgM = Math.floor((avgSec % 3600) / 60);
            const avgDurationStr = avgH > 0 ? `${avgH}sa ${avgM}dk` : `${Math.max(15, avgM)}dk`;

            const mRecords = Object.values(monthlyMap).sort((a, b) => b.monthKey.localeCompare(a.monthKey));
            const lockedMonths = mRecords.filter(m => m.isLocked);
            const avgDaysToLock = lockedMonths.length > 0
                ? (lockedMonths.reduce((sum, m) => sum + (m.daysToLock || 0), 0) / lockedMonths.length).toFixed(1)
                : null;

            return {
                rsiLength,
                buyRsi,
                sellRsi,
                winRate: `${winRateVal.toFixed(0)}%`,
                winRateDouble: winRateVal,
                avgDurationFormatted: avgDurationStr,
                totalTrades,
                netPnl: totPnl,
                monthlyBreakdowns: mRecords,
                avgDaysToLock,
                lockedMonthsRatio: `${lockedMonths.length}/${Math.max(1, mRecords.length)} Ay`
            };
        }

        // Otomatik En İdeal Seviyeleri Bulan Grid Arama
        function evaluateBestRsi(candles, rsiLength, profitTarget, monthlyCap) {
            const closePrices = candles.map(c => c.close);
            const rsiVals = calculateRSIHistory(closePrices, rsiLength);
            let bestCandidate = null;

            for (let buy = 12; buy <= 40; buy += 1) {
                for (let sell = 60; sell <= 95; sell += 1) {
                    let inPos = false, entryP = 0, totPnl = 0, winCount = 0, totalTrades = 0;
                    let monthlyStats = {};

                    for (let i = rsiLength + 1; i < candles.length; i++) {
                        const c = candles[i];
                        const rsi = rsiVals[i];
                        const prevRsi = rsiVals[i - 1];
                        if (rsi === null || prevRsi === null) continue;

                        const mKey = c.monthKey;
                        if (!monthlyStats[mKey]) monthlyStats[mKey] = { pnl: 0 };
                        const isCapReached = (monthlyStats[mKey].pnl + 0.001) >= monthlyCap;

                        if (!inPos && !isCapReached) {
                            if (prevRsi <= buy && rsi > buy) {
                                inPos = true;
                                entryP = c.close;
                            }
                        } else if (inPos) {
                            const targetP = entryP * (1.0 + profitTarget / 100.0);
                            let exited = false, pnl = 0;

                            if (c.high >= targetP) {
                                exited = true;
                                pnl = profitTarget;
                            } else if (rsi >= sell) {
                                exited = true;
                                pnl = ((c.close - entryP) / entryP) * 100.0;
                            }

                            if (exited) {
                                inPos = false;
                                totalTrades++;
                                if (pnl >= 0) winCount++;
                                totPnl += pnl;
                                monthlyStats[mKey].pnl += pnl;
                            }
                        }
                    }

                    if (totalTrades >= 1) {
                        const winRate = (winCount / totalTrades) * 100.0;
                        const score = totPnl * Math.pow(winRate / 100.0, 1.5);
                        if (!bestCandidate || score > bestCandidate.score) {
                            bestCandidate = { buyRsi: buy, sellRsi: sell, score };
                        }
                    }
                }
            }

            const chosenBuy = bestCandidate ? bestCandidate.buyRsi : 25;
            const chosenSell = bestCandidate ? bestCandidate.sellRsi : 75;
            return simulateSingleConfig(candles, rsiLength, chosenBuy, chosenSell, profitTarget, monthlyCap);
        }

        // --- LİG BENCHMARK ÇALIŞTIRICI ---
        async function runLeagueBenchmark() {
            if (LEAGUE_STATE.isAnalyzing || LEAGUE_STATE.coinPool.length === 0) return;
            LEAGUE_STATE.isAnalyzing = true;

            const btn = document.getElementById('btnRunLeague');
            const pBox = document.getElementById('progressBox');
            const pBar = document.getElementById('progressBar');
            const pStatus = document.getElementById('progressStatusText');
            const pPct = document.getElementById('progressPctText');
            const resultsBox = document.getElementById('resultsContainer');

            btn.disabled = true;
            btn.classList.add('opacity-50');
            pBox.classList.remove('hidden');
            resultsBox.innerHTML = '';
            LEAGUE_STATE.results = [];

            const total = LEAGUE_STATE.coinPool.length;
            const targetCap = getMonthlyCap();

            for (let i = 0; i < total; i++) {
                const coin = LEAGUE_STATE.coinPool[i];
                const fullSymbol = coin + "USDT";
                pStatus.textContent = `Taranıyor: ${coin} (RSI 6 & 7)...`;
                pBar.style.width = `${Math.round((i / total) * 100)}%`;
                pPct.textContent = `${Math.round((i / total) * 100)}%`;

                try {
                    const candles = await fetchAllCandlesSince2026(fullSymbol, LEAGUE_STATE.selectedInterval);
                    if (candles && candles.length > 30) {
                        LEAGUE_STATE.candleCache[fullSymbol] = candles;

                        const m6 = evaluateBestRsi(candles, 6, LEAGUE_STATE.profitTarget, targetCap);
                        const m7 = evaluateBestRsi(candles, 7, LEAGUE_STATE.profitTarget, targetCap);

                        const bestScore = Math.max(
                            Math.floor(m6.winRateDouble * 0.5 + Math.min(m6.netPnl, 50.0) * 0.3),
                            Math.floor(m7.winRateDouble * 0.5 + Math.min(m7.netPnl, 50.0) * 0.3)
                        );

                        LEAGUE_STATE.results.push({
                            symbol: fullSymbol,
                            displaySymbol: coin,
                            score: bestScore,
                            profitTarget: LEAGUE_STATE.profitTarget,
                            monthlyCap: targetCap,
                            activeTab: 6,
                            isExpanded: false,
                            rsi6: m6,
                            rsi7: m7
                        });
                    }
                } catch (e) {
                    console.warn(`Hata [${coin}]:`, e.message);
                }
            }

            pBar.style.width = `100%`;
            pPct.textContent = `100%`;
            pStatus.textContent = `Analiz tamamlandı!`;

            LEAGUE_STATE.results.sort((a, b) => b.score - a.score);
            LEAGUE_STATE.results.forEach((res, idx) => res.rank = idx + 1);

            renderLeagueResults();

            LEAGUE_STATE.isAnalyzing = false;
            btn.disabled = false;
            btn.classList.remove('opacity-50');
            setTimeout(() => pBox.classList.add('hidden'), 1200);
        }

        // --- KARTLARIN RENDER EDİLMESİ ---
        function renderLeagueResults() {
            const container = document.getElementById('resultsContainer');
            if (LEAGUE_STATE.results.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs">Sonuç bulunamadı.</div>`;
                return;
            }

            container.innerHTML = LEAGUE_STATE.results.map((res, idx) => {
                const active = res.activeTab === 6 ? res.rsi6 : res.rsi7;
                const other = res.activeTab === 6 ? res.rsi7 : res.rsi6;

                return `
                    <div id="league-card-${res.symbol}" class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-4 shadow-sm space-y-3 transition">
                        
                        <!-- Üst Başlık -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <span class="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold text-xs">#${res.rank}</span>
                                <div>
                                    <div class="flex items-center space-x-1.5">
                                        <h3 class="font-extrabold text-base text-slate-900 dark:text-white">${res.displaySymbol}</h3>
                                        <span class="text-[10px] text-slate-400 font-medium">/USDT</span>
                                    </div>
                                    <p class="text-[10px] text-slate-500 font-medium">Hedef %${res.profitTarget.toFixed(1)} • Kilit %${res.monthlyCap.toFixed(1)}</p>
                                </div>
                            </div>

                            <div class="flex items-center space-x-2">
                                <!-- RSI 6 / 7 Seçici Kapsülü -->
                                <div class="flex items-center p-0.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-[10px] font-bold">
                                    <button onclick="switchRsiTab('${res.symbol}', 6)" class="px-2.5 py-1 rounded-md transition ${res.activeTab === 6 ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800 dark:hover:text-white'}">RSI 6</button>
                                    <button onclick="switchRsiTab('${res.symbol}', 7)" class="px-2.5 py-1 rounded-md transition ${res.activeTab === 7 ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800 dark:hover:text-white'}">RSI 7</button>
                                </div>

                                <!-- Terminale Aktar Butonu -->
                                <button onclick="addStrategyToTerminal('${res.symbol}')" class="px-3 py-1.5 rounded-lg bg-slate-900 dark:bg-white hover:bg-slate-800 dark:hover:bg-slate-100 text-white dark:text-slate-900 font-bold text-xs transition flex items-center space-x-1">
                                    <span>+ Ekle</span>
                                </button>
                            </div>
                        </div>

                        <!-- Orta Kısım: Aktif RSI Metrikleri -->
                        <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200/70 dark:border-slate-700/60 space-y-2">
                            <div class="flex items-center justify-between text-xs font-bold">
                                <div class="flex items-center space-x-1.5">
                                    <span class="text-blue-600 dark:text-blue-400">RSI(${active.rsiLength})</span>
                                    <span class="px-1.5 py-0.5 rounded bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800 text-[10px]">AL: ≤${active.buyRsi}</span>
                                    <span class="px-1.5 py-0.5 rounded bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-800 text-[10px]">SAT: ≥${active.sellRsi}</span>
                                </div>
                                <span class="text-[10px] text-slate-400 font-medium">Diğeri: ${other.winRate} / ${other.avgDurationFormatted}</span>
                            </div>

                            <div class="grid grid-cols-4 gap-1 pt-1 text-center divide-x divide-slate-200 dark:divide-slate-700">
                                <div>
                                    <span class="block text-[8px] font-bold text-slate-400 uppercase">KAZANMA</span>
                                    <span class="font-extrabold text-xs tabular-nums ${active.winRateDouble >= 75 ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-800 dark:text-slate-200'}">${active.winRate}</span>
                                </div>
                                <div>
                                    <span class="block text-[8px] font-bold text-slate-400 uppercase">ORT. SÜRE</span>
                                    <span class="font-extrabold text-xs text-blue-600 dark:text-blue-400">${active.avgDurationFormatted}</span>
                                </div>
                                <div>
                                    <span class="block text-[8px] font-bold text-slate-400 uppercase">İŞLEM</span>
                                    <span class="font-extrabold text-xs text-slate-800 dark:text-slate-200 tabular-nums">${active.totalTrades}</span>
                                </div>
                                <div>
                                    <span class="block text-[8px] font-bold text-slate-400 uppercase">NET KÂR</span>
                                    <span class="font-extrabold text-xs tabular-nums ${active.netPnl >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}">${active.netPnl >= 0 ? '+' : ''}${active.netPnl.toFixed(1)}%</span>
                                </div>
                            </div>
                        </div>

                        <!-- Genişletilebilir Ayarlar & Aylık Döküm Çubuğu -->
                        <div>
                            <button onclick="toggleCardExpand('${res.symbol}')" class="w-full flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white pt-1">
                                <span class="font-medium text-[11px]">
                                    ${active.avgDaysToLock ? `Ort. Kilit Hızı: <strong>${active.avgDaysToLock} Gün</strong> (${active.lockedMonthsRatio})` : `Aylık Kilit Geçmişi (${active.lockedMonthsRatio})`}
                                </span>
                                <span class="text-blue-600 dark:text-blue-400 font-bold text-[11px]">${res.isExpanded ? 'Kapat ▲' : 'Ayarla & Detay ▼'}</span>
                            </button>

                            ${res.isExpanded ? `
                                <div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-800 space-y-3">
                                    
                                    <!-- Canlı RSI Ayarlayıcı -->
                                    <div class="flex items-center justify-between gap-2 text-xs">
                                        <div class="flex items-center space-x-1.5 bg-slate-50 dark:bg-slate-800 p-1.5 rounded-xl border border-slate-200 dark:border-slate-700">
                                            <span class="text-[10px] font-bold text-emerald-600 dark:text-emerald-400">AL RSI:</span>
                                            <button onclick="adjustLiveRsi('${res.symbol}', -1, 0)" class="w-6 h-5 rounded bg-white dark:bg-slate-700 font-bold shadow-sm">-</button>
                                            <span class="font-black text-slate-900 dark:text-white px-1">≤${active.buyRsi}</span>
                                            <button onclick="adjustLiveRsi('${res.symbol}', 1, 0)" class="w-6 h-5 rounded bg-white dark:bg-slate-700 font-bold shadow-sm">+</button>
                                        </div>

                                        <div class="flex items-center space-x-1.5 bg-slate-50 dark:bg-slate-800 p-1.5 rounded-xl border border-slate-200 dark:border-slate-700">
                                            <span class="text-[10px] font-bold text-rose-600 dark:text-rose-400">SAT RSI:</span>
                                            <button onclick="adjustLiveRsi('${res.symbol}', 0, -1)" class="w-6 h-5 rounded bg-white dark:bg-slate-700 font-bold shadow-sm">-</button>
                                            <span class="font-black text-slate-900 dark:text-white px-1">≥${active.sellRsi}</span>
                                            <button onclick="adjustLiveRsi('${res.symbol}', 0, 1)" class="w-6 h-5 rounded bg-white dark:bg-slate-700 font-bold shadow-sm">+</button>
                                        </div>
                                    </div>

                                    <!-- Aylık Kilit Geçmişi Tablosu -->
                                    <div class="space-y-1 max-h-48 overflow-y-auto pr-1">
                                        ${active.monthlyBreakdowns.map(m => {
                                            const mIndex = parseInt(m.monthKey.split('-')[1]) - 1;
                                            const mTitle = monthNames[mIndex] || m.monthKey;
                                            return `
                                                <div class="flex items-center justify-between p-2 rounded-lg bg-slate-50 dark:bg-slate-800/40 text-[11px]">
                                                    <span class="font-semibold text-slate-800 dark:text-slate-200 w-16">${mTitle}</span>
                                                    <span class="text-slate-500 dark:text-slate-400">
                                                        ${m.isLocked ? `${m.firstTradeDay}. Gün → ${m.lockDay}. Gün <strong class="text-blue-600">(${m.daysToLock} gün)</strong>` : `${m.firstTradeDay}. Gün → Kilitlenemedi`}
                                                    </span>
                                                    <span class="font-bold tabular-nums ${m.totalMonthPnl >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}">
                                                        ${m.totalMonthPnl >= 0 ? '+' : ''}${m.totalMonthPnl.toFixed(1)}%
                                                    </span>
                                                </div>`;
                                        }).join('')}
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function switchRsiTab(symbol, tabNum) {
            const item = LEAGUE_STATE.results.find(r => r.symbol === symbol);
            if (item) {
                item.activeTab = tabNum;
                renderLeagueResults();
            }
        }

        function toggleCardExpand(symbol) {
            const item = LEAGUE_STATE.results.find(r => r.symbol === symbol);
            if (item) {
                item.isExpanded = !item.isExpanded;
                renderLeagueResults();
            }
        }

        function adjustLiveRsi(symbol, deltaBuy, deltaSell) {
            const item = LEAGUE_STATE.results.find(r => r.symbol === symbol);
            const candles = LEAGUE_STATE.candleCache[symbol];
            if (!item || !candles) return;

            const active = item.activeTab === 6 ? item.rsi6 : item.rsi7;
            const newBuy = Math.min(50, Math.max(8, active.buyRsi + deltaBuy));
            const newSell = Math.min(98, Math.max(55, active.sellRsi + deltaSell));

            const updated = simulateSingleConfig(candles, active.rsiLength, newBuy, newSell, item.profitTarget, item.monthlyCap);
            if (item.activeTab === 6) item.rsi6 = updated; else item.rsi7 = updated;

            renderLeagueResults();
        }

        // Terminale Ekle (index.html ile paylaşılan localStorage anahtarına yazar)
        function addStrategyToTerminal(symbol) {
            const item = LEAGUE_STATE.results.find(r => r.symbol === symbol);
            if (!item) return;

            const active = item.activeTab === 6 ? item.rsi6 : item.rsi7;
            let currentCoins = [];
            try {
                currentCoins = JSON.parse(localStorage.getItem('kuzgun_web_coins')) || [];
            } catch (e) { currentCoins = []; }

            const newCardConfig = {
                id: 'c_' + Date.now(),
                symbol: item.symbol,
                displaySymbol: item.displaySymbol,
                interval: LEAGUE_STATE.selectedInterval,
                rsiLength: active.rsiLength,
                buyRsi: active.buyRsi,
                sellRsi: active.sellRsi,
                profitTarget: item.profitTarget,
                monthlyCap: item.monthlyCap,
                price: 0, prevPrice: 0, high24: 0, low24: 0,
                rsi: 50.0, prevRsi: 50.0,
                candles: [], isExpanded: false, activeSubTab: 'monthly',
                avgHoldDurationStr: active.avgDurationFormatted
            };

            const existingIdx = currentCoins.findIndex(c => c.symbol === item.symbol);
            if (existingIdx !== -1) {
                currentCoins[existingIdx] = Object.assign(currentCoins[existingIdx], newCardConfig);
            } else {
                currentCoins.push(newCardConfig);
            }

            localStorage.setItem('kuzgun_web_coins', JSON.stringify(currentCoins));
            showToast(`${item.displaySymbol} (RSI ${active.rsiLength}) Terminal'e Eklendi!`);
        }

        // Başlat
        document.addEventListener('DOMContentLoaded', () => {
            renderPool();
        });
    </script>
