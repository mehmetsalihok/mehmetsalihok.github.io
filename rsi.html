<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASTER/USDT 30m RSI(8) Strateji Panosu</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --box-bg: #f1f5f9;
      --badge-bg: #e2e8f0;
      --badge-text: #0284c7;
      --table-stripe: #f8fafc;
    }

    body.dark-mode {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --box-bg: #0f172a;
      --badge-bg: #334155;
      --badge-text: #38bdf8;
      --table-stripe: #182232;
    }

    * { box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 24px;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 440px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      transition: background-color 0.3s, border-color 0.3s;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 16px;
      background-color: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .theme-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .symbol {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .price {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .rsi-container {
      background-color: var(--box-bg);
      padding: 12px 14px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border-color);
      margin-bottom: 12px;
    }

    .rsi-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .rsi-value {
      font-size: 1.4rem;
      font-weight: 800;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat-box {
      background-color: var(--box-bg);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .stat-value {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .strategy-box {
      background-color: var(--box-bg);
      border-left: 4px solid #eab308;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .strategy-box.buy-signal { border-color: #22c55e; }
    .strategy-box.sell-signal { border-color: #ef4444; }

    .strategy-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .strategy-status {
      font-size: 0.85rem;
      font-weight: 700;
    }

    .tracker-box {
      background-color: var(--box-bg);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 12px;
    }

    .tracker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .tracker-btn-group {
      display: flex;
      gap: 6px;
    }

    .track-btn {
      flex: 1;
      padding: 6px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.75rem;
    }

    .track-btn.active {
      background-color: #22c55e;
      color: #fff;
      border-color: #22c55e;
    }

    /* Tablo Stilleri */
    .table-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .input-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .input-group input {
      width: 100px;
      padding: 6px 8px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--box-bg);
      color: var(--text-color);
      font-weight: 600;
      font-size: 0.85rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      text-align: left;
    }

    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
    }

    tr:nth-child(even) {
      background-color: var(--table-stripe);
    }

    .overbought { color: #ef4444; }
    .oversold { color: #22c55e; }
    .neutral { color: #eab308; }

    .update-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- ANA TAKİP KART -->
    <div class="card">
      <div class="header-bar">
        <div class="badge">30m | RSI (8)</div>
        <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">🌙 Gece Modu</button>
      </div>

      <div class="symbol">ASTER / USDT</div>
      <div class="price" id="price">Yükleniyor...</div>
      
      <div class="rsi-container">
        <span class="rsi-title">Anlık RSI (8)</span>
        <span class="rsi-value neutral" id="rsi">--,--</span>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-label">24S En Düşük RSI</span>
          <span class="stat-value oversold" id="min-rsi">--,--</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">24S En Yüksek RSI</span>
          <span class="stat-value overbought" id="max-rsi">--,--</span>
        </div>
      </div>

      <!-- ÖZEL STRATEJİ SİNYALİ -->
      <div class="strategy-box neutral" id="strategy-box">
        <div class="strategy-title">Strateji Sinyali (Al: ≤22 | Sat: ≥85)</div>
        <div class="strategy-status" id="strategy-status">Veriler analiz ediliyor...</div>
      </div>

      <!-- AYLIK İŞLEM TAKİP SAYACI -->
      <div class="tracker-box">
        <div class="tracker-header">
          <span>Bu Ayki %5 Kar Hedefi:</span>
          <span id="monthly-progress" style="color: #22c55e;">%0 / %5</span>
        </div>
        <div class="tracker-btn-group">
          <button class="track-btn" onclick="toggleTrade(1)">İşlem 1 (%1)</button>
          <button class="track-btn" onclick="toggleTrade(2)">İşlem 2 (%1)</button>
          <button class="track-btn" onclick="toggleTrade(3)">İşlem 3 (%1)</button>
          <button class="track-btn" onclick="toggleTrade(4)">İşlem 4 (%1)</button>
          <button class="track-btn" onclick="toggleTrade(5)">İşlem 5 (%1)</button>
        </div>
      </div>

      <div class="update-time" id="last-update"></div>
    </div>

    <!-- AYLIK BİLEŞİK KAR TABLOSU -->
    <div class="card">
      <div class="table-title">
        <span>Aylık %5 Bileşik Kar Tablosu</span>
      </div>
      
      <div class="input-group">
        <label for="capital">Sermaye ($):</label>
        <input type="number" id="capital" value="1000" oninput="calculateProfitTable()">
      </div>

      <table>
        <thead>
          <tr>
            <th>Ay</th>
            <th>Hedef (%)</th>
            <th>Top Toplam ($)</th>
            <th>Net Kar ($)</th>
          </tr>
        </thead>
        <tbody id="profit-table-body">
          <!-- JS ile dolacak -->
        </tbody>
      </table>
    </div>

  </div>

  <script>
    const SYMBOL = 'ASTERUSDT';
    const INTERVAL = '30m';
    const RSI_PERIOD = 8;
    let completedTrades = 0;

    // Wilder's RSI Hesaplama
    function calculateRSIHistory(prices, period = 8) {
      if (prices.length <= period) return [];

      let gains = 0;
      let losses = 0;

      for (let i = 1; i <= period; i++) {
        const change = prices[i] - prices[i - 1];
        if (change >= 0) gains += change;
        else losses += Math.abs(change);
      }

      let avgGain = gains / period;
      let avgLoss = losses / period;

      const rsiHistory = [];
      let firstRSI = avgLoss === 0 ? 100 : 100 - (100 / (1 + (avgGain / avgLoss)));
      rsiHistory.push(firstRSI);

      for (let i = period + 1; i < prices.length; i++) {
        const change = prices[i] - prices[i - 1];
        const currentGain = change >= 0 ? change : 0;
        const currentLoss = change < 0 ? Math.abs(change) : 0;

        avgGain = (avgGain * (period - 1) + currentGain) / period;
        avgLoss = (avgLoss * (period - 1) + currentLoss) / period;

        if (avgLoss === 0) {
          rsiHistory.push(100);
        } else {
          const rs = avgGain / avgLoss;
          rsiHistory.push(100 - (100 / (1 + rs)));
        }
      }

      return rsiHistory;
    }

    function formatRSI(val) {
      return Number(val).toFixed(2).replace('.', ',');
    }

    async function fetchAsterRSI() {
      const endpoints = [
        `https://api.binance.com/api/v3/klines?symbol=${SYMBOL}&interval=${INTERVAL}&limit=100`,
        `https://api1.binance.com/api/v3/klines?symbol=${SYMBOL}&interval=${INTERVAL}&limit=100`,
        `https://api2.binance.com/api/v3/klines?symbol=${SYMBOL}&interval=${INTERVAL}&limit=100`
      ];

      let data = null;

      for (const url of endpoints) {
        try {
          const response = await fetch(url);
          if (response.ok) {
            data = await response.json();
            break;
          }
        } catch (e) {
          console.warn(`Endpoint hatası: ${url}`);
        }
      }

      if (!data) {
        document.getElementById('strategy-status').innerText = 'API erişim hatası!';
        return;
      }

      try {
        const closePrices = data.map(candle => parseFloat(candle[4]));
        const currentPrice = closePrices[closePrices.length - 1];

        const rsiHistory = calculateRSIHistory(closePrices, RSI_PERIOD);
        if (rsiHistory.length === 0) throw new Error("Yetersiz veri");

        const currentRSI = rsiHistory[rsiHistory.length - 1];

        const last24hRSI = rsiHistory.slice(-48);
        const minRSI = Math.min(...last24hRSI);
        const maxRSI = Math.max(...last24hRSI);

        // Arayüz Güncelleme
        document.getElementById('price').innerText = `$${currentPrice.toFixed(4)}`;
        
        const rsiElement = document.getElementById('rsi');
        rsiElement.innerText = formatRSI(currentRSI);
        document.getElementById('min-rsi').innerText = formatRSI(minRSI);
        document.getElementById('max-rsi').innerText = formatRSI(maxRSI);

        // Strateji Kontrolü (Al: <=22, Sat: >=85)
        const stratBox = document.getElementById('strategy-box');
        const stratStatus = document.getElementById('strategy-status');

        stratBox.className = 'strategy-box ';

        if (currentRSI <= 22) {
          stratBox.classList.add('buy-signal');
          stratStatus.innerHTML = '🟢 <b>ALIM BÖLGESİ (RSI ≤ 22)</b><br>Dip dönüşü bekleniyor, kademeli takip et.';
        } else if (currentRSI >= 85) {
          stratBox.classList.add('sell-signal');
          stratStatus.innerHTML = '⚠️ <b>SATIŞ BÖLGESİ (RSI ≥ 85)</b><br>Zirve dönüşü veya %1 kar hedefinde pozisyonu kapat!';
        } else {
          stratBox.classList.add('neutral');
          stratStatus.innerText = '🟡 Pozisyon Takibinde / Nötr Bölge';
        }

        const now = new Date();
        document.getElementById('last-update').innerText = `Son Güncelleme: ${now.toLocaleTimeString('tr-TR')}`;

      } catch (error) {
        console.error('Veri işleme hatası:', error);
        document.getElementById('strategy-status').innerText = 'Hesaplama hatası!';
      }
    }

    // Aylık Bileşik Kar Tablosunu Hesaplama
    function calculateProfitTable() {
      const capitalInput = parseFloat(document.getElementById('capital').value) || 0;
      const tbody = document.getElementById('profit-table-body');
      tbody.innerHTML = '';

      let currentBalance = capitalInput;
      const monthlyRate = 0.05; // %5 Aylık Kar

      for (let month = 1; month <= 12; month++) {
        const profit = currentBalance * monthlyRate;
        currentBalance += profit;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${month}. Ay</b></td>
          <td>%5</td>
          <td><b>$${currentBalance.toFixed(2)}</b></td>
          <td style="color: #22c55e;">+$${profit.toFixed(2)}</td>
        `;
        tbody.appendChild(tr);
      }
    }

    // İşlem Sayacı Butonları
    function toggleTrade(index) {
      const btns = document.querySelectorAll('.track-btn');
      const btn = btns[index - 1];

      if (btn.classList.contains('active')) {
        btn.classList.remove('active');
        completedTrades--;
      } else {
        btn.classList.add('active');
        completedTrades++;
      }

      document.getElementById('monthly-progress').innerText = `%${completedTrades} / %5`;
    }

    // Gece Modu Aç / Kapat
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      const btn = document.getElementById('theme-btn');
      if (document.body.classList.contains('dark-mode')) {
        btn.innerText = '☀️ Gündüz Modu';
      } else {
        btn.innerText = '🌙 Gece Modu';
      }
    }

    // Başlangıç Çalıştırmaları
    fetchAsterRSI();
    calculateProfitTable();
    setInterval(fetchAsterRSI, 3000);
  </script>
</body>
</html>
