<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODEMSO Kripto Terminali & RSI Radar</title>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --box-bg: #0f172a;
      --badge-bg: #334155;
      --badge-text: #38bdf8;
      --table-stripe: #182232;
      --input-bg: #0f172a;
    }

    body.light-mode {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --box-bg: #f1f5f9;
      --badge-bg: #e2e8f0;
      --badge-text: #0284c7;
      --table-stripe: #f8fafc;
      --input-bg: #ffffff;
    }

    * { box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 8px;
      font-size: 0.72rem;
      transition: background-color 0.2s, color 0.2s;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 1700px;
      margin: 0 auto;
    }

    .header-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 6px 10px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .main-layout {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    @media (min-width: 1150px) {
      .main-layout {
        display: grid;
        grid-template-columns: 1fr 450px;
        align-items: start;
      }
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 8px;
    }

    @media (min-width: 768px) and (max-width: 1149px) {
      .dashboard-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      gap: 5px;
      position: relative;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 6px;
      background-color: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.62rem;
      font-weight: 700;
    }

    .theme-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.62rem;
      font-weight: 600;
    }

    .add-card-btn {
      background: #22c55e;
      color: #ffffff;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.65rem;
      font-weight: bold;
    }

    .add-card-btn:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    .remove-card-btn {
      background: transparent;
      color: #ef4444;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.8rem;
      padding: 0 4px;
    }

    .coin-input {
      padding: 2px 4px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background-color: var(--input-bg);
      color: var(--text-color);
      font-size: 0.78rem;
      font-weight: 800;
      width: 110px;
      text-transform: uppercase;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .price {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    .stat-box {
      background-color: var(--box-bg);
      padding: 3px 5px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .stat-label {
      font-size: 0.58rem;
      color: var(--text-muted);
      display: block;
      font-weight: 600;
    }

    .stat-value {
      font-size: 0.9rem;
      font-weight: 800;
    }

    .position-box {
      background-color: var(--box-bg);
      padding: 5px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .coin-settings-box {
      background-color: var(--box-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 5px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .coin-setting-item {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .coin-setting-item label {
      font-size: 0.56rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .coin-setting-item input, .coin-setting-item select {
      padding: 2px 3px;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      background-color: var(--card-bg);
      color: var(--text-color);
      font-size: 0.65rem;
      font-weight: 700;
      width: 100%;
    }

    .sidebar-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 8px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: sticky;
      top: 8px;
    }

    .add-coin-row {
      display: flex;
      gap: 4px;
    }

    .add-coin-row input, .add-coin-row select {
      padding: 3px 4px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--input-bg);
      color: var(--text-color);
      font-weight: 700;
      font-size: 0.65rem;
    }

    .add-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.65rem;
    }

    .watchlist-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.62rem;
    }

    .watchlist-table th, .watchlist-table td {
      padding: 4px 3px;
      border-bottom: 1px solid var(--border-color);
      text-align: center;
    }

    .watchlist-table th {
      color: var(--text-muted);
      font-size: 0.58rem;
      text-transform: uppercase;
    }

    .alarm-input {
      width: 38px;
      padding: 2px 3px;
      font-size: 0.65rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--input-bg);
      color: var(--text-color);
      text-align: center;
      font-weight: 700;
    }

    .select-mini {
      padding: 2px 3px;
      font-size: 0.62rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--input-bg);
      color: var(--text-color);
      font-weight: 700;
    }

    .action-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0 2px;
      font-size: 0.65rem;
    }

    .action-btn:hover { color: var(--text-color); }

    .alarm-triggered {
      animation: pulseAlert 0.8s infinite alternate;
      font-weight: 900;
    }

    @keyframes pulseAlert {
      from { background-color: rgba(239, 68, 68, 0.15); }
      to { background-color: rgba(239, 68, 68, 0.55); }
    }

    .table-title {
      font-size: 0.65rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      padding: 2px 0;
      border-top: 1px solid var(--border-color);
      margin-top: 2px;
    }

    .collapsible-content {
      display: none;
      margin-top: 2px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.6rem;
      text-align: left;
    }

    th, td {
      padding: 2px 3px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.55rem;
      text-transform: uppercase;
    }

    tr:nth-child(even) { background-color: var(--table-stripe); }

    .green { color: #22c55e; }
    .red { color: #ef4444; }
    .neutral { color: #eab308; }

    .loader {
      font-size: 0.58rem;
      color: #0284c7;
      font-weight: 600;
    }
  </style>
</head>
<body class="dark-mode">

  <div class="container" id="main-app">
    
    <div class="header-card">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="badge">CODEMSO TERMINAL & RADAR</span>
        <button class="add-card-btn" id="btn-add-card" onclick="addNewCard()">+ Yeni Kart Ekle (<span id="card-count-label">2</span>/8)</button>
        <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">☀️ Gündüz Modu</button>
        <button class="theme-btn" onclick="playTestSound()">🔊 Ses Testi</button>
      </div>

      <div style="display: flex; align-items: center; gap: 6px;">
        <label style="font-weight:700; font-size:0.65rem; color:var(--text-muted)">Genel Yıl Seçimi:</label>
        <select id="global-year" style="padding: 2px 6px; border-radius:4px; background:var(--input-bg); color:var(--text-color); font-weight:700; border:1px solid var(--border-color);" onchange="changeGlobalYear()">
          <option value="2026">2026</option>
          <option value="2025">2025</option>
        </select>
      </div>
    </div>

    <div class="main-layout">
      <!-- ANALİZ KARTLARI IZGARASI -->
      <div class="dashboard-grid" id="grid-container"></div>

      <!-- SAĞ SIDEBAR RADAR VE ÖZET PERFORMANS PANOSU -->
      <div class="sidebar-card">
        <!-- 1. ALARMLI RADAR -->
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <span style="font-weight: 800; font-size: 0.72rem;">⚡ CANLI RSI RADAR (1s Canlı)</span>
            <span style="font-size: 0.58rem; color: var(--text-muted);" id="radar-update-time">Canlı</span>
          </div>

          <div class="add-coin-row" style="margin-bottom: 6px;">
            <input type="text" id="new-radar-coin" placeholder="Örn: DOGE" style="flex:1;">
            <select id="new-radar-tf" class="select-mini">
              <option value="5m">5m</option>
              <option value="15m">15m</option>
              <option value="30m" selected>30m</option>
              <option value="1h">1h</option>
              <option value="4h">4h</option>
            </select>
            <input type="number" id="new-radar-len" value="8" placeholder="RSI" style="width:38px;">
            <button class="add-btn" onclick="addRadarCoin()">+ Ekle</button>
          </div>

          <table class="watchlist-table">
            <thead>
              <tr>
                <th style="text-align: left;">Coin</th>
                <th>TF</th>
                <th>RSI Per.</th>
                <th>RSI</th>
                <th>Min (≤)</th>
                <th>Max (≥)</th>
                <th>Sıra</th>
                <th>Sil</th>
              </tr>
            </thead>
            <tbody id="radar-tbody"></tbody>
          </table>
        </div>

        <!-- 2. KARTLARIN PERFORMANS & KÂR ÖZETİ PANOSU -->
        <div style="border-top: 1px solid var(--border-color); padding-top: 8px;">
          <div style="font-weight: 800; font-size: 0.72rem; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;">
            <span>📊 KART PERFORMANS ÖZETİ (<span id="summary-year-label">2026</span>)</span>
          </div>
          <table class="watchlist-table">
            <thead>
              <tr>
                <th style="text-align: left;">Coin</th>
                <th>Bu Ay (%)</th>
                <th>Yıllık Toplam (%)</th>
              </tr>
            </thead>
            <tbody id="summary-tbody"></tbody>
          </table>
        </div>

      </div>
    </div>

  </div>

  <script>
    const STORAGE_KEY = 'codemso_multi_terminal_v9';

    let SELECTED_YEAR = '2026';
    let candlesData = [];
    let cardProfits = [];

    let coinsConfig = [
      { symbol: 'ASTERUSDT', interval: '30m', rsiLength: 8, buyRsi: 20, sellRsi: 85, profitTarget: 4.0, monthlyCap: 2.5 },
      { symbol: 'BTCUSDT',   interval: '30m', rsiLength: 10, buyRsi: 25, sellRsi: 75, profitTarget: 2.0, monthlyCap: 3.0 }
    ];

    let radarWatchlist = [
      { symbol: 'ASTERUSDT', interval: '30m', rsiLength: 8,  buyAlarm: 20, sellAlarm: 85, currentRsi: null },
      { symbol: 'DOGEUSDT',  interval: '15m', rsiLength: 10, buyAlarm: 20, sellAlarm: 85, currentRsi: null },
      { symbol: 'PEPEUSDT',  interval: '5m',  rsiLength: 8,  buyAlarm: 20, sellAlarm: 80, currentRsi: null },
      { symbol: 'AVAXUSDT',  interval: '30m', rsiLength: 10, buyAlarm: 22, sellAlarm: 80, currentRsi: null },
      { symbol: 'NEARUSDT',  interval: '1h',  rsiLength: 14, buyAlarm: 25, sellAlarm: 75, currentRsi: null }
    ];

    function formatNum(val, dec = 2) {
      if (val === null || val === undefined || isNaN(val)) return '--,--';
      return Number(val).toFixed(dec).replace('.', ',');
    }

    function toggleAccordion(id) {
      const el = document.getElementById(id);
      el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      document.getElementById('theme-btn').innerText = isLight ? '🌙 Gece Modu' : '☀️ Gündüz Modu';
    }

    function playBeepSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch(e) {}
    }

    function playTestSound() { playBeepSound(); }

    function loadSavedConfig() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed.coinsConfig && parsed.coinsConfig.length > 0) coinsConfig = parsed.coinsConfig;
          if (parsed.radarWatchlist) radarWatchlist = parsed.radarWatchlist;
          if (parsed.year) SELECTED_YEAR = parsed.year;
        } catch(e) {}
      }
      document.getElementById('global-year').value = SELECTED_YEAR;
      document.getElementById('summary-year-label').innerText = SELECTED_YEAR;
      renderCardsHTML();
      renderRadarHTML();
    }

    function saveConfig() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        coinsConfig,
        radarWatchlist,
        year: SELECTED_YEAR
      }));
    }

    function addNewCard() {
      if (coinsConfig.length >= 8) {
        alert('Maksimum 8 adet analiz kartı ekleyebilirsiniz!');
        return;
      }

      coinsConfig.push({
        symbol: 'SOLUSDT',
        interval: '30m',
        rsiLength: 8,
        buyRsi: 22,
        sellRsi: 80,
        profitTarget: 3.0,
        monthlyCap: 3.0
      });

      saveConfig();
      renderCardsHTML();
      loadCoinData(coinsConfig.length - 1);
    }

    function removeCard(slotIndex) {
      if (coinsConfig.length <= 1) {
        alert('En az 1 adet analiz kartı bulunmalıdır!');
        return;
      }

      coinsConfig.splice(slotIndex, 1);
      candlesData.splice(slotIndex, 1);
      cardProfits.splice(slotIndex, 1);

      saveConfig();
      renderCardsHTML();
      renderProfitSummarySidebar();
    }

    function renderCardsHTML() {
      const grid = document.getElementById('grid-container');
      grid.innerHTML = '';

      const addBtn = document.getElementById('btn-add-card');
      const countLabel = document.getElementById('card-count-label');
      if (countLabel) countLabel.innerText = coinsConfig.length;
      if (addBtn) addBtn.disabled = coinsConfig.length >= 8;

      coinsConfig.forEach((coin, i) => {
        const cardHTML = `
          <div class="card" id="card-${i}">
            <div class="header-bar">
              <input type="text" class="coin-input" value="${coin.symbol}" id="coin-symbol-${i}" onchange="updateCoinSetting(${i})">
              <div>
                <span class="loader" id="loader-${i}">Yükleniyor...</span>
                <button class="remove-card-btn" onclick="removeCard(${i})" title="Kartı Sil">✖</button>
              </div>
            </div>

            <div class="price-row">
              <span class="price" id="price-${i}">--.--</span>
              <span style="font-size:0.6rem; color:var(--text-muted)" id="tf-label-${i}">${coin.interval} | RSI(${coin.rsiLength})</span>
            </div>

            <div class="grid-2">
              <div class="stat-box">
                <span class="stat-label">Anlık RSI</span>
                <span class="stat-value neutral" id="rsi-${i}">--,--</span>
              </div>
              <div class="stat-box">
                <span class="stat-label">Pozisyon</span>
                <span class="stat-value" id="pos-${i}">Nötr</span>
              </div>
            </div>

            <div class="position-box">
              <div style="display: flex; justify-content: space-between; font-size: 0.62rem;">
                <span>Giriş: <b id="entry-${i}">-</b></span>
                <span>Canlı PnL: <b id="live-pnl-${i}">0,00%</b></span>
                <span>Hedef: <b id="target-${i}" class="green">-</b></span>
              </div>
            </div>

            <div class="coin-settings-box">
              <div class="coin-setting-item">
                <label>TF:</label>
                <select id="setting-interval-${i}" onchange="updateCoinSetting(${i})">
                  <option value="5m" ${coin.interval==='5m'?'selected':''}>5m</option>
                  <option value="15m" ${coin.interval==='15m'?'selected':''}>15m</option>
                  <option value="30m" ${coin.interval==='30m'?'selected':''}>30m</option>
                  <option value="1h" ${coin.interval==='1h'?'selected':''}>1h</option>
                  <option value="4h" ${coin.interval==='4h'?'selected':''}>4h</option>
                </select>
              </div>
              <div class="coin-setting-item">
                <label>RSI Per.:</label>
                <input type="number" id="setting-rsiLength-${i}" value="${coin.rsiLength}" onchange="updateCoinSetting(${i})">
              </div>
              <div class="coin-setting-item">
                <label>RSI Al:</label>
                <input type="number" id="setting-buyRsi-${i}" value="${coin.buyRsi}" onchange="updateCoinSetting(${i})">
              </div>
              <div class="coin-setting-item">
                <label>RSI Sat:</label>
                <input type="number" id="setting-sellRsi-${i}" value="${coin.sellRsi}" onchange="updateCoinSetting(${i})">
              </div>
              <div class="coin-setting-item">
                <label>Kâr (%):</label>
                <input type="number" step="0.1" id="setting-profitTarget-${i}" value="${coin.profitTarget}" onchange="updateCoinSetting(${i})">
              </div>
              <div class="coin-setting-item">
                <label>Ay Kilit (%):</label>
                <input type="number" step="0.5" id="setting-monthlyCap-${i}" value="${coin.monthlyCap}" onchange="updateCoinSetting(${i})">
              </div>
            </div>

            <div class="table-title" onclick="toggleAccordion('acc-monthly-${i}')">
              <span>📅 Aylık Performans Tablosu (${SELECTED_YEAR})</span>
              <span>▼</span>
            </div>
            <div class="collapsible-content" id="acc-monthly-${i}">
              <table>
                <thead><tr><th>Ay</th><th>İşl.</th><th>Win</th><th>Loss</th><th>Net Kâr (%)</th></tr></thead>
                <tbody id="table-monthly-${i}"></tbody>
              </table>
            </div>

            <div class="table-title" onclick="toggleAccordion('acc-trades-${i}')">
              <span>📜 Son İşlemler Logu</span>
              <span>▼</span>
            </div>
            <div class="collapsible-content" id="acc-trades-${i}">
              <table>
                <thead><tr><th>Giriş</th><th>Çıkış</th><th>Net (%)</th><th>Neden</th></tr></thead>
                <tbody id="table-trades-${i}"></tbody>
              </table>
            </div>
          </div>
        `;
        grid.innerHTML += cardHTML;
      });

      // Kartlar render edildikten sonra hafızadaki canlı durumları koru
      for (let i = 0; i < coinsConfig.length; i++) {
        if (candlesData[i] && candlesData[i].length > 0) {
          const loaderEl = document.getElementById(`loader-${i}`);
          if (loaderEl) loaderEl.innerText = '🟢 Canlı';
          runBacktestAndRender(i);
        } else {
          loadCoinData(i);
        }
      }
    }

    function renderRadarHTML() {
      const tbody = document.getElementById('radar-tbody');
      tbody.innerHTML = '';

      radarWatchlist.forEach((item, index) => {
        let rsiDisplay = item.currentRsi !== null ? formatNum(item.currentRsi, 2) : '--,--';
        let rsiClass = 'neutral';
        let alertClass = '';

        if (item.currentRsi !== null) {
          if (item.currentRsi <= item.buyAlarm) {
            rsiClass = 'green';
            alertClass = 'alarm-triggered';
          } else if (item.currentRsi >= item.sellAlarm) {
            rsiClass = 'red';
            alertClass = 'alarm-triggered';
          }
        }

        const tr = document.createElement('tr');
        tr.className = alertClass;
        tr.innerHTML = `
          <td style="text-align: left;"><b>${item.symbol.replace('USDT', '')}</b></td>
          <td>
            <select class="select-mini" onchange="updateRadarItem(${index}, 'interval', this.value)">
              <option value="5m" ${item.interval==='5m'?'selected':''}>5m</option>
              <option value="15m" ${item.interval==='15m'?'selected':''}>15m</option>
              <option value="30m" ${item.interval==='30m'?'selected':''}>30m</option>
              <option value="1h" ${item.interval==='1h'?'selected':''}>1h</option>
            </select>
          </td>
          <td>
            <input type="number" class="alarm-input" value="${item.rsiLength}" onchange="updateRadarItem(${index}, 'rsiLength', this.value)">
          </td>
          <td class="${rsiClass}"><b>${rsiDisplay}</b></td>
          <td><input type="number" class="alarm-input" value="${item.buyAlarm}" onchange="updateRadarItem(${index}, 'buyAlarm', this.value)"></td>
          <td><input type="number" class="alarm-input" value="${item.sellAlarm}" onchange="updateRadarItem(${index}, 'sellAlarm', this.value)"></td>
          <td>
            <button class="action-btn" onclick="moveRadarCoin(${index}, -1)">▲</button>
            <button class="action-btn" onclick="moveRadarCoin(${index}, 1)">▼</button>
          </td>
          <td><button class="action-btn red" onclick="removeRadarCoin(${index})">✖</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderProfitSummarySidebar() {
      const tbody = document.getElementById('summary-tbody');
      if (!tbody) return;
      tbody.innerHTML = '';

      let grandTotalMonth = 0;
      let grandTotalYear = 0;

      coinsConfig.forEach((coin, i) => {
        const profitObj = cardProfits[i] || { monthPnl: 0, yearPnl: 0 };
        grandTotalMonth += profitObj.monthPnl;
        grandTotalYear += profitObj.yearPnl;

        const tr = document.createElement('tr');
        const mClass = profitObj.monthPnl >= 0 ? 'green' : 'red';
        const yClass = profitObj.yearPnl >= 0 ? 'green' : 'red';

        tr.innerHTML = `
          <td style="text-align: left;"><b>${coin.symbol.replace('USDT', '')}</b></td>
          <td class="${mClass}"><b>${profitObj.monthPnl >= 0 ? '+' : ''}${formatNum(profitObj.monthPnl, 2)}%</b></td>
          <td class="${yClass}"><b>${profitObj.yearPnl >= 0 ? '+' : ''}${formatNum(profitObj.yearPnl, 2)}%</b></td>
        `;
        tbody.appendChild(tr);
      });

      const totalTr = document.createElement('tr');
      const totMClass = grandTotalMonth >= 0 ? 'green' : 'red';
      const totYClass = grandTotalYear >= 0 ? 'green' : 'red';

      totalTr.innerHTML = `
        <td style="text-align: left;"><b>TOPLAM</b></td>
        <td class="${totMClass}"><b>${grandTotalMonth >= 0 ? '+' : ''}${formatNum(grandTotalMonth, 2)}%</b></td>
        <td class="${totYClass}"><b>${grandTotalYear >= 0 ? '+' : ''}${formatNum(grandTotalYear, 2)}%</b></td>
      `;
      tbody.appendChild(totalTr);
    }

    function addRadarCoin() {
      const input = document.getElementById('new-radar-coin');
      const tfSelect = document.getElementById('new-radar-tf');
      const lenInput = document.getElementById('new-radar-len');

      let val = input.value.toUpperCase().trim();
      if (!val) return;
      if (!val.endsWith('USDT')) val += 'USDT';

      radarWatchlist.push({
        symbol: val,
        interval: tfSelect.value || '30m',
        rsiLength: parseInt(lenInput.value) || 8,
        buyAlarm: 20,
        sellAlarm: 85,
        currentRsi: null
      });

      input.value = '';
      saveConfig();
      renderRadarHTML();
      fetchRadarRSIAll();
    }

    function removeRadarCoin(index) {
      radarWatchlist.splice(index, 1);
      saveConfig();
      renderRadarHTML();
    }

    function moveRadarCoin(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= radarWatchlist.length) return;
      
      const temp = radarWatchlist[index];
      radarWatchlist[index] = radarWatchlist[newIndex];
      radarWatchlist[newIndex] = temp;

      saveConfig();
      renderRadarHTML();
    }

    function updateRadarItem(index, field, value) {
      if (field === 'rsiLength' || field === 'buyAlarm' || field === 'sellAlarm') {
        radarWatchlist[index][field] = parseFloat(value) || 0;
      } else {
        radarWatchlist[index][field] = value;
      }
      saveConfig();
      fetchRadarRSIAll();
    }

    async function fetchRadarRSIAll() {
      let alarmTriggeredAny = false;

      for (let item of radarWatchlist) {
        try {
          const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${item.symbol}&interval=${item.interval}&limit=50`);
          if (res.ok) {
            const data = await res.json();
            const closePrices = data.map(c => parseFloat(c[4]));
            
            const rsiVals = calculateRSIHistory(closePrices, item.rsiLength);
            const currentRSI = rsiVals[rsiVals.length - 1];

            item.currentRsi = currentRSI;

            if (currentRSI <= item.buyAlarm || currentRSI >= item.sellAlarm) {
              alarmTriggeredAny = true;
            }
          }
        } catch(e) {}
      }

      renderRadarHTML();
      if (alarmTriggeredAny) {
        playBeepSound();
      }

      const now = new Date();
      document.getElementById('radar-update-time').innerText = now.toLocaleTimeString('tr-TR');
    }

    // AYAR DEĞİŞTİĞİNDE ANINDA TEPKİ VEREN AKILLI MOTOR
    function updateCoinSetting(slotIndex) {
      let sym = document.getElementById(`coin-symbol-${slotIndex}`).value.toUpperCase().trim();
      if (!sym.endsWith('USDT')) sym += 'USDT';
      
      document.getElementById(`coin-symbol-${slotIndex}`).value = sym;

      const oldCoin = coinsConfig[slotIndex] || {};
      const newInterval = document.getElementById(`setting-interval-${slotIndex}`).value || '30m';
      
      const symbolChanged = (oldCoin.symbol !== sym);
      const intervalChanged = (oldCoin.interval !== newInterval);

      coinsConfig[slotIndex] = {
        symbol: sym,
        interval: newInterval,
        rsiLength: parseInt(document.getElementById(`setting-rsiLength-${slotIndex}`).value) || 8,
        buyRsi: parseFloat(document.getElementById(`setting-buyRsi-${slotIndex}`).value) || 20,
        sellRsi: parseFloat(document.getElementById(`setting-sellRsi-${slotIndex}`).value) || 85,
        profitTarget: parseFloat(document.getElementById(`setting-profitTarget-${slotIndex}`).value) || 4.0,
        monthlyCap: parseFloat(document.getElementById(`setting-monthlyCap-${slotIndex}`).value) || 2.5
      };

      document.getElementById(`tf-label-${slotIndex}`).innerText = `${coinsConfig[slotIndex].interval} | RSI(${coinsConfig[slotIndex].rsiLength})`;

      saveConfig();

      // SADECE Sembol veya TF değişirse Binance'ten yeniden indir, yoksa HAFIZADAN ANINDA HESAPLA!
      if (symbolChanged || intervalChanged || !candlesData[slotIndex] || candlesData[slotIndex].length === 0) {
        candlesData[slotIndex] = [];
        loadCoinData(slotIndex);
      } else {
        runBacktestAndRender(slotIndex);
      }
    }

    function changeGlobalYear() {
      SELECTED_YEAR = document.getElementById('global-year').value;
      document.getElementById('summary-year-label').innerText = SELECTED_YEAR;
      saveConfig();
      candlesData = [];
      renderCardsHTML();
    }

    function calculateRSIHistory(prices, period = 8) {
      if (prices.length <= period) return [];
      let gains = 0, losses = 0;
      for (let i = 1; i <= period; i++) {
        const change = prices[i] - prices[i - 1];
        if (change >= 0) gains += change;
        else losses += Math.abs(change);
      }
      let avgGain = gains / period;
      let avgLoss = losses / period;

      const rsiHistory = new Array(prices.length).fill(null);
      let firstRSI = avgLoss === 0 ? 100 : 100 - (100 / (1 + (avgGain / avgLoss)));
      rsiHistory[period] = firstRSI;

      for (let i = period + 1; i < prices.length; i++) {
        const change = prices[i] - prices[i - 1];
        const currentGain = change >= 0 ? change : 0;
        const currentLoss = change < 0 ? Math.abs(change) : 0;

        avgGain = (avgGain * (period - 1) + currentGain) / period;
        avgLoss = (avgLoss * (period - 1) + currentLoss) / period;

        if (avgLoss === 0) rsiHistory[i] = 100;
        else rsiHistory[i] = 100 - (100 / (1 + (avgGain / avgLoss)));
      }
      return rsiHistory;
    }

    async function loadCoinData(slotIndex) {
      const coin = coinsConfig[slotIndex];
      if (!coin) return;

      const loaderEl = document.getElementById(`loader-${slotIndex}`);
      if (loaderEl) loaderEl.innerText = 'Yükleniyor...';

      const yearStart = new Date(`${SELECTED_YEAR}-01-01T00:00:00Z`).getTime();
      const yearEnd = SELECTED_YEAR === '2026' ? Date.now() : new Date(`${SELECTED_YEAR}-12-31T23:59:59Z`).getTime();

      let allCandles = [];
      let startTime = yearStart;

      while (startTime < yearEnd) {
        const url = `https://api.binance.com/api/v3/klines?symbol=${coin.symbol}&interval=${coin.interval}&limit=1000&startTime=${startTime}`;
        try {
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            if (!data || data.length === 0) break;

            const parsed = data.map(c => ({
              rawTime: c[0],
              open: parseFloat(c[1]),
              high: parseFloat(c[2]),
              low: parseFloat(c[3]),
              close: parseFloat(c[4])
            })).filter(c => c.rawTime <= yearEnd);

            allCandles = allCandles.concat(parsed);
            if (data.length < 1000) break;
            startTime = data[data.length - 1][0] + 1;
          } else { break; }
        } catch (e) { console.error(e); break; }
      }

      candlesData[slotIndex] = allCandles;
      if (loaderEl) loaderEl.innerText = '🟢 Canlı';
      runBacktestAndRender(slotIndex);
    }

    function runBacktestAndRender(slotIndex) {
      const coin = coinsConfig[slotIndex];
      if (!coin) return;

      const candles = candlesData[slotIndex];
      const loaderEl = document.getElementById(`loader-${slotIndex}`);

      if (!candles || candles.length === 0) {
        if (loaderEl) loaderEl.innerText = '⚠️ Hata / Yanlış Coin';
        return;
      }

      const closePrices = candles.map(c => c.close);
      const rsiValues = calculateRSIHistory(closePrices, coin.rsiLength);

      let inPosition = false;
      let entryPrice = 0;

      const trades = [];
      const monthlyStats = {};

      for (let i = coin.rsiLength + 1; i < candles.length; i++) {
        const c = candles[i];
        const rsiVal = rsiValues[i];
        const prevRsiVal = rsiValues[i - 1];

        const dateObj = new Date(c.rawTime);
        const monthKey = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;

        if (!monthlyStats[monthKey]) {
          monthlyStats[monthKey] = { trades: 0, win: 0, loss: 0, pnl: 0, capReached: false };
        }

        const mStat = monthlyStats[monthKey];

        if (!inPosition && !mStat.capReached) {
          if (prevRsiVal <= coin.buyRsi && rsiVal > coin.buyRsi) {
            inPosition = true;
            entryPrice = c.close;
          }
        }

        else if (inPosition) {
          const targetPrice = entryPrice * (1 + coin.profitTarget / 100);

          let exited = false;
          let pnl = 0;
          let reason = '';

          if (c.high >= targetPrice) {
            exited = true;
            pnl = coin.profitTarget;
            reason = `Kâr (%${coin.profitTarget})`;
          } else if (rsiVal >= coin.sellRsi) {
            exited = true;
            pnl = ((c.close - entryPrice) / entryPrice) * 100;
            reason = `RSI Sat (${formatNum(rsiVal, 1)})`;
          }

          if (exited) {
            inPosition = false;
            const isWin = pnl >= 0;

            trades.push({ entryTime: c.rawTime, exitTime: c.rawTime, entryPrice, exitPrice: c.close, pnl, isWin, reason });

            const curM = monthlyStats[monthKey];
            curM.trades++;
            if (isWin) curM.win++;
            else curM.loss++;
            curM.pnl += pnl;

            if (curM.pnl >= coin.monthlyCap) curM.capReached = true;
          }
        }
      }

      const currentPrice = closePrices[closePrices.length - 1];
      const currentRSI = rsiValues[rsiValues.length - 1];

      const priceEl = document.getElementById(`price-${slotIndex}`);
      const rsiEl = document.getElementById(`rsi-${slotIndex}`);
      if (priceEl) priceEl.innerText = `$${currentPrice.toFixed(4)}`;
      if (rsiEl) rsiEl.innerText = formatNum(currentRSI, 2);

      const posEl = document.getElementById(`pos-${slotIndex}`);
      const entryEl = document.getElementById(`entry-${slotIndex}`);
      const livePnlEl = document.getElementById(`live-pnl-${slotIndex}`);
      const targetEl = document.getElementById(`target-${slotIndex}`);

      if (inPosition) {
        if (posEl) { posEl.innerText = 'LONG'; posEl.className = 'stat-value green'; }
        if (entryEl) entryEl.innerText = `$${entryPrice.toFixed(4)}`;
        
        const targetP = entryPrice * (1 + coin.profitTarget / 100);
        if (targetEl) targetEl.innerText = `$${targetP.toFixed(4)}`;

        const livePnl = ((currentPrice - entryPrice) / entryPrice) * 100;
        if (livePnlEl) {
          livePnlEl.innerText = `${formatNum(livePnl, 2)}%`;
          livePnlEl.className = livePnl >= 0 ? 'green' : 'red';
        }
      } else {
        if (posEl) { posEl.innerText = 'Nötr'; posEl.className = 'stat-value neutral'; }
        if (entryEl) entryEl.innerText = '-';
        if (livePnlEl) { livePnlEl.innerText = '0,00%'; livePnlEl.className = ''; }
        if (targetEl) targetEl.innerText = '-';
      }

      const mTable = document.getElementById(`table-monthly-${slotIndex}`);
      let totT = 0, totW = 0, totL = 0, totPnl = 0;
      let currentMonthPnl = 0;

      const nowD = new Date();
      const activeMonthKey = `${SELECTED_YEAR}-${String(nowD.getMonth() + 1).padStart(2, '0')}`;

      if (mTable) mTable.innerHTML = '';

      Object.keys(monthlyStats).sort().reverse().forEach(mKey => {
        const m = monthlyStats[mKey];
        if (m.trades === 0) return;
        totT += m.trades; totW += m.win; totL += m.loss; totPnl += m.pnl;

        if (mKey === activeMonthKey) {
          currentMonthPnl = m.pnl;
        }

        if (mTable) {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><b>${mKey}</b></td>
            <td>${m.trades}</td>
            <td class="green">${m.win}</td>
            <td class="red">${m.loss}</td>
            <td class="${m.pnl >= 0 ? 'green':'red'}"><b>${m.pnl >= 0 ? '+':''}${formatNum(m.pnl, 2)}%</b></td>
          `;
          mTable.appendChild(tr);
        }
      });

      if (mTable) {
        const totalTr = document.createElement('tr');
        totalTr.innerHTML = `
          <td><b>TOPLAM</b></td>
          <td><b>${totT}</b></td>
          <td class="green"><b>${totW}</b></td>
          <td class="red"><b>${totL}</b></td>
          <td class="${totPnl >= 0 ? 'green':'red'}"><b>${totPnl >= 0 ? '+':''}${formatNum(totPnl, 2)}%</b></td>
        `;
        mTable.appendChild(totalTr);
      }

      cardProfits[slotIndex] = { monthPnl: currentMonthPnl, yearPnl: totPnl };
      renderProfitSummarySidebar();

      const tTable = document.getElementById(`table-trades-${slotIndex}`);
      if (tTable) {
        tTable.innerHTML = '';
        trades.slice(-5).reverse().forEach(t => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>$${t.entryPrice.toFixed(3)}</td>
            <td>$${t.exitPrice.toFixed(3)}</td>
            <td class="${t.pnl >= 0 ? 'green':'red'}"><b>${t.pnl >= 0 ? '+':''}${formatNum(t.pnl, 2)}%</b></td>
            <td>${t.reason}</td>
          `;
          tTable.appendChild(tr);
        });
      }
    }

    function initApp() {
      loadSavedConfig();
      for (let i = 0; i < coinsConfig.length; i++) {
        loadCoinData(i);
      }
      fetchRadarRSIAll();

      setInterval(() => {
        coinsConfig.forEach((coin, slotIndex) => {
          if (candlesData[slotIndex] && candlesData[slotIndex].length > 0 && SELECTED_YEAR === '2026') {
            fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${coin.symbol}`)
              .then(res => res.json())
              .then(data => {
                const livePrice = parseFloat(data.price);
                const candles = candlesData[slotIndex];
                candles[candles.length - 1].close = livePrice;
                runBacktestAndRender(slotIndex);
              }).catch(e => console.warn(e));
          }
        });
      }, 1000);

      setInterval(fetchRadarRSIAll, 1000);
    }

    window.onload = function() {
      initApp();
    };
  </script>
