<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODEMSO 4'lü Kripto Terminali</title>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --box-bg: #0f172a;
      --badge-bg: #334155;
      --badge-text: #38bdf8;
      --table-stripe: #182232;
      --input-bg: #0f172a;
    }

    body.light-mode {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --box-bg: #f1f5f9;
      --badge-bg: #e2e8f0;
      --badge-text: #0284c7;
      --table-stripe: #f8fafc;
      --input-bg: #ffffff;
    }

    * { box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 10px;
      font-size: 0.72rem;
      transition: background-color 0.2s, color 0.2s;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .header-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* 4'LÜ IZGARA (2x2 GRID) */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 10px;
    }

    @media (min-width: 900px) {
      .dashboard-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 10px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 6px;
      background-color: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.62rem;
      font-weight: 700;
    }

    .theme-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.62rem;
      font-weight: 600;
    }

    .coin-input {
      padding: 3px 6px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background-color: var(--input-bg);
      color: var(--text-color);
      font-size: 0.8rem;
      font-weight: 800;
      width: 120px;
      text-transform: uppercase;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .price {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    .stat-box {
      background-color: var(--box-bg);
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .stat-label {
      font-size: 0.6rem;
      color: var(--text-muted);
      display: block;
      font-weight: 600;
    }

    .stat-value {
      font-size: 0.95rem;
      font-weight: 800;
    }

    .position-box {
      background-color: var(--box-bg);
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    /* HER COINE ÖZEL AYARLAR PANOSU */
    .coin-settings-box {
      background-color: var(--box-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .coin-setting-item {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .coin-setting-item label {
      font-size: 0.58rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .coin-setting-item input {
      padding: 2px 4px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background-color: var(--card-bg);
      color: var(--text-color);
      font-size: 0.68rem;
      font-weight: 700;
      width: 100%;
    }

    /* ACCORDION BAŞLIKLAR */
    .table-title {
      font-size: 0.68rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      padding: 3px 0;
      border-top: 1px solid var(--border-color);
      margin-top: 2px;
    }

    .collapsible-content {
      display: none;
      margin-top: 2px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.62rem;
      text-align: left;
    }

    th, td {
      padding: 2px 4px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.58rem;
      text-transform: uppercase;
    }

    tr:nth-child(even) {
      background-color: var(--table-stripe);
    }

    .green { color: #22c55e; }
    .red { color: #ef4444; }
    .neutral { color: #eab308; }

    .loader {
      font-size: 0.6rem;
      color: #0284c7;
      font-weight: 600;
    }
  </style>
</head>
<body class="dark-mode">

  <div class="container">
    
    <!-- GENEL BAŞLIK VE YIL SEÇİMİ -->
    <div class="header-card">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="badge">CODEMSO TERMINAL (4 COIN)</span>
        <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">☀️ Gündüz Modu</button>
      </div>

      <div style="display: flex; align-items: center; gap: 6px;">
        <label style="font-weight:700; font-size:0.68rem; color:var(--text-muted)">Genel Yıl Seçimi:</label>
        <select id="global-year" style="padding: 2px 6px; border-radius:4px; background:var(--input-bg); color:var(--text-color); font-weight:700; border:1px solid var(--border-color);" onchange="changeGlobalYear()">
          <option value="2026">2026</option>
          <option value="2025">2025</option>
        </select>
      </div>
    </div>

    <!-- 4'LÜ COIN TERMINAL IZGARASI -->
    <div class="dashboard-grid" id="grid-container">
      <!-- JS İLE DOLDURULACAK -->
    </div>

  </div>

  <script>
    const STORAGE_KEY = 'codemso_multi_terminal_v2';
    const INTERVAL = '30m';
    const RSI_PERIOD = 8;

    let SELECTED_YEAR = '2026';
    let candlesData = [[], [], [], []];

    // Her Coin İçin Varsayılan ve Bağımsız Ayarlar
    let coinsConfig = [
      { symbol: 'ASTERUSDT', buyRsi: 20, sellRsi: 85, profitTarget: 4.0, monthlyCap: 2.5 },
      { symbol: 'BTCUSDT',   buyRsi: 25, sellRsi: 75, profitTarget: 2.0, monthlyCap: 3.0 },
      { symbol: 'ETHUSDT',   buyRsi: 25, sellRsi: 75, profitTarget: 2.5, monthlyCap: 3.0 },
      { symbol: 'SOLUSDT',   buyRsi: 22, sellRsi: 80, profitTarget: 3.0, monthlyCap: 3.0 }
    ];

    function formatNum(val, dec = 2) {
      if (val === null || val === undefined || isNaN(val)) return '--,--';
      return Number(val).toFixed(dec).replace('.', ',');
    }

    function toggleAccordion(id) {
      const el = document.getElementById(id);
      el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      document.getElementById('theme-btn').innerText = isLight ? '🌙 Gece Modu' : '☀️ Gündüz Modu';
    }

    // AYARLARI OKU VE KARTLARI OLUŞTUR
    function loadSavedConfig() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed.coinsConfig) coinsConfig = parsed.coinsConfig;
          if (parsed.year) SELECTED_YEAR = parsed.year;
        } catch(e) {}
      }
      document.getElementById('global-year').value = SELECTED_YEAR;
      renderCardsHTML();
    }

    function saveConfig() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        coinsConfig,
        year: SELECTED_YEAR
      }));
    }

    // 4 KARTI HTML OLARAK DİNAMİK YAZDIRMA
    function renderCardsHTML() {
      const grid = document.getElementById('grid-container');
      grid.innerHTML = '';

      coinsConfig.forEach((coin, i) => {
        const cardHTML = `
          <div class="card" id="card-${i}">
            <div class="header-bar">
              <input type="text" class="coin-input" value="${coin.symbol}" id="coin-symbol-${i}" onchange="updateCoinSetting(${i})">
              <span class="loader" id="loader-${i}">Yükleniyor...</span>
            </div>

            <div class="price-row">
              <span class="price" id="price-${i}">--.--</span>
              <span style="font-size:0.62rem; color:var(--text-muted)">30m | RSI(8)</span>
            </div>

            <div class="grid-2">
              <div class="stat-box">
                <span class="stat-label">Anlık RSI</span>
                <span class="stat-value neutral" id="rsi-${i}">--,--</span>
              </div>
              <div class="stat-box">
                <span class="stat-label">Pozisyon</span>
                <span class="stat-value" id="pos-${i}">Nötr</span>
              </div>
            </div>

            <div class="position-box">
              <div style="display: flex; justify-content: space-between; font-size: 0.65rem;">
                <span>Giriş: <b id="entry-${i}">-</b></span>
                <span>Canlı PnL: <b id="live-pnl-${i}">0,00%</b></span>
                <span>Hedef: <b id="target-${i}" class="green">-</b></span>
              </div>
            </div>

            <!-- HER COINE ÖZEL AYARLAR PANOSU -->
            <div class="coin-settings-box">
              <div class="coin-setting-item">
                <label>RSI Al:</label>
                <input type="number" id="setting-buyRsi-${i}" value="${coin.buyRsi}" onchange="updateCoinSetting(${i})">
              </div>
              <div class="coin-setting-item">
                <label>RSI Sat:</label>
                <input type="number" id="setting-sellRsi-${i}" value="${coin.sellRsi}" onchange="updateCoinSetting(${i})">
              </div>
              <div class="coin-setting-item">
                <label>Kâr (%):</label>
                <input type="number" step="0.1" id="setting-profitTarget-${i}" value="${coin.profitTarget}" onchange="updateCoinSetting(${i})">
              </div>
              <div class="coin-setting-item">
                <label>Ay Kilit (%):</label>
                <input type="number" step="0.5" id="setting-monthlyCap-${i}" value="${coin.monthlyCap}" onchange="updateCoinSetting(${i})">
              </div>
            </div>

            <!-- ACCORDION TABLOLAR -->
            <div class="table-title" onclick="toggleAccordion('acc-monthly-${i}')">
              <span>📅 Aylık Performans Tablosu (${SELECTED_YEAR})</span>
              <span>▼</span>
            </div>
            <div class="collapsible-content" id="acc-monthly-${i}">
              <table>
                <thead><tr><th>Ay</th><th>İşl.</th><th>Win</th><th>Loss</th><th>Net Kâr (%)</th></tr></thead>
                <tbody id="table-monthly-${i}"></tbody>
              </table>
            </div>

            <div class="table-title" onclick="toggleAccordion('acc-trades-${i}')">
              <span>📜 Son İşlemler Logu</span>
              <span>▼</span>
            </div>
            <div class="collapsible-content" id="acc-trades-${i}">
              <table>
                <thead><tr><th>Giriş</th><th>Çıkış</th><th>Net (%)</th><th>Neden</th></tr></thead>
                <tbody id="table-trades-${i}"></tbody>
              </table>
            </div>
          </div>
        `;
        grid.innerHTML += cardHTML;
      });
    }

    // TEK COİNİN AYARINI GÜNCELLEME
    function updateCoinSetting(slotIndex) {
      let sym = document.getElementById(`coin-symbol-${slotIndex}`).value.toUpperCase().trim();
      if (!sym.endsWith('USDT')) sym += 'USDT';
      
      document.getElementById(`coin-symbol-${slotIndex}`).value = sym;

      coinsConfig[slotIndex] = {
        symbol: sym,
        buyRsi: parseFloat(document.getElementById(`setting-buyRsi-${slotIndex}`).value) || 20,
        sellRsi: parseFloat(document.getElementById(`setting-sellRsi-${slotIndex}`).value) || 85,
        profitTarget: parseFloat(document.getElementById(`setting-profitTarget-${slotIndex}`).value) || 4.0,
        monthlyCap: parseFloat(document.getElementById(`setting-monthlyCap-${slotIndex}`).value) || 2.5
      };

      saveConfig();
      loadCoinData(slotIndex);
    }

    function changeGlobalYear() {
      SELECTED_YEAR = document.getElementById('global-year').value;
      saveConfig();
      renderCardsHTML();
      for (let i = 0; i < 4; i++) {
        loadCoinData(i);
      }
    }

    // RSI HESAPLAMA (WILDER'S FORMÜLÜ)
    function calculateRSIHistory(prices, period = 8) {
      if (prices.length <= period) return [];
      let gains = 0, losses = 0;
      for (let i = 1; i <= period; i++) {
        const change = prices[i] - prices[i - 1];
        if (change >= 0) gains += change;
        else losses += Math.abs(change);
      }
      let avgGain = gains / period;
      let avgLoss = losses / period;

      const rsiHistory = new Array(prices.length).fill(null);
      let firstRSI = avgLoss === 0 ? 100 : 100 - (100 / (1 + (avgGain / avgLoss)));
      rsiHistory[period] = firstRSI;

      for (let i = period + 1; i < prices.length; i++) {
        const change = prices[i] - prices[i - 1];
        const currentGain = change >= 0 ? change : 0;
        const currentLoss = change < 0 ? Math.abs(change) : 0;

        avgGain = (avgGain * (period - 1) + currentGain) / period;
        avgLoss = (avgLoss * (period - 1) + currentLoss) / period;

        if (avgLoss === 0) rsiHistory[i] = 100;
        else rsiHistory[i] = 100 - (100 / (1 + (avgGain / avgLoss)));
      }
      return rsiHistory;
    }

    // BINANCE YILLIK VERİ ÇEKME MOTORU
    async function loadCoinData(slotIndex) {
      const coin = coinsConfig[slotIndex];
      const loaderEl = document.getElementById(`loader-${slotIndex}`);
      if (loaderEl) loaderEl.innerText = 'Yükleniyor...';

      const yearStart = new Date(`${SELECTED_YEAR}-01-01T00:00:00Z`).getTime();
      const yearEnd = SELECTED_YEAR === '2026' ? Date.now() : new Date(`${SELECTED_YEAR}-12-31T23:59:59Z`).getTime();

      let allCandles = [];
      let startTime = yearStart;

      while (startTime < yearEnd) {
        const url = `https://api.binance.com/api/v3/klines?symbol=${coin.symbol}&interval=${INTERVAL}&limit=1000&startTime=${startTime}`;
        try {
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            if (!data || data.length === 0) break;

            const parsed = data.map(c => ({
              rawTime: c[0],
              open: parseFloat(c[1]),
              high: parseFloat(c[2]),
              low: parseFloat(c[3]),
              close: parseFloat(c[4])
            })).filter(c => c.rawTime <= yearEnd);

            allCandles = allCandles.concat(parsed);
            if (data.length < 1000) break;
            startTime = data[data.length - 1][0] + 1;
          } else { break; }
        } catch (e) { console.error(e); break; }
      }

      candlesData[slotIndex] = allCandles;
      if (loaderEl) loaderEl.innerText = '🟢 Canlı';
      runBacktestAndRender(slotIndex);
    }

    // SİMÜLASYON MOTORU
    function runBacktestAndRender(slotIndex) {
      const coin = coinsConfig[slotIndex];
      const candles = candlesData[slotIndex];
      const loaderEl = document.getElementById(`loader-${slotIndex}`);

      if (!candles || candles.length === 0) {
        if (loaderEl) loaderEl.innerText = '⚠️ Hata / Yanlış Coin';
        return;
      }

      const closePrices = candles.map(c => c.close);
      const rsiValues = calculateRSIHistory(closePrices, RSI_PERIOD);

      let inPosition = false;
      let entryPrice = 0;

      const trades = [];
      const monthlyStats = {};

      for (let i = RSI_PERIOD + 1; i < candles.length; i++) {
        const c = candles[i];
        const rsiVal = rsiValues[i];
        const prevRsiVal = rsiValues[i - 1];

        const dateObj = new Date(c.rawTime);
        const monthKey = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;

        if (!monthlyStats[monthKey]) {
          monthlyStats[monthKey] = { trades: 0, win: 0, loss: 0, pnl: 0, capReached: false };
        }

        const mStat = monthlyStats[monthKey];

        // 1. AL SİNYALİ
        if (!inPosition && !mStat.capReached) {
          if (prevRsiVal <= coin.buyRsi && rsiVal > coin.buyRsi) {
            inPosition = true;
            entryPrice = c.close;
          }
        }

        // 2. SAT SİNYALİ
        else if (inPosition) {
          const targetPrice = entryPrice * (1 + coin.profitTarget / 100);

          let exited = false;
          let pnl = 0;
          let reason = '';

          if (c.high >= targetPrice) {
            exited = true;
            pnl = coin.profitTarget;
            reason = `Kâr (%${coin.profitTarget})`;
          } else if (rsiVal >= coin.sellRsi) {
            exited = true;
            pnl = ((c.close - entryPrice) / entryPrice) * 100;
            reason = `RSI Sat (${formatNum(rsiVal, 1)})`;
          }

          if (exited) {
            inPosition = false;
            const isWin = pnl >= 0;

            trades.push({ entryTime: c.rawTime, exitTime: c.rawTime, entryPrice, exitPrice: c.close, pnl, isWin, reason });

            const curM = monthlyStats[monthKey];
            curM.trades++;
            if (isWin) curM.win++;
            else curM.loss++;
            curM.pnl += pnl;

            if (curM.pnl >= coin.monthlyCap) curM.capReached = true;
          }
        }
      }

      // ANLIK KART VERİLERİ
      const currentPrice = closePrices[closePrices.length - 1];
      const currentRSI = rsiValues[rsiValues.length - 1];

      document.getElementById(`price-${slotIndex}`).innerText = `$${currentPrice.toFixed(4)}`;
      document.getElementById(`rsi-${slotIndex}`).innerText = formatNum(currentRSI, 2);

      const posEl = document.getElementById(`pos-${slotIndex}`);
      const entryEl = document.getElementById(`entry-${slotIndex}`);
      const livePnlEl = document.getElementById(`live-pnl-${slotIndex}`);
      const targetEl = document.getElementById(`target-${slotIndex}`);

      if (inPosition) {
        posEl.innerText = 'LONG';
        posEl.className = 'stat-value green';
        entryEl.innerText = `$${entryPrice.toFixed(4)}`;
        
        const targetP = entryPrice * (1 + coin.profitTarget / 100);
        targetEl.innerText = `$${targetP.toFixed(4)}`;

        const livePnl = ((currentPrice - entryPrice) / entryPrice) * 100;
        livePnlEl.innerText = `${formatNum(livePnl, 2)}%`;
        livePnlEl.className = livePnl >= 0 ? 'green' : 'red';
      } else {
        posEl.innerText = 'Nötr';
        posEl.className = 'stat-value neutral';
        entryEl.innerText = '-';
        livePnlEl.innerText = '0,00%';
        livePnlEl.className = '';
        targetEl.innerText = '-';
      }

      // AYLIK TABLO DOLDUR
      const mTable = document.getElementById(`table-monthly-${slotIndex}`);
      mTable.innerHTML = '';
      let totT = 0, totW = 0, totL = 0, totPnl = 0;

      Object.keys(monthlyStats).sort().reverse().forEach(mKey => {
        const m = monthlyStats[mKey];
        if (m.trades === 0) return;
        totT += m.trades; totW += m.win; totL += m.loss; totPnl += m.pnl;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${mKey}</b></td>
          <td>${m.trades}</td>
          <td class="green">${m.win}</td>
          <td class="red">${m.loss}</td>
          <td class="${m.pnl >= 0 ? 'green':'red'}"><b>${m.pnl >= 0 ? '+':''}${formatNum(m.pnl, 2)}%</b></td>
        `;
        mTable.appendChild(tr);
      });

      // İŞLEM LOGU DOLDUR (Son 5 İşlem)
      const tTable = document.getElementById(`table-trades-${slotIndex}`);
      tTable.innerHTML = '';
      trades.slice(-5).reverse().forEach(t => {
        const tr = document.createElement('tr');
        const d = new Date(t.exitTime).toLocaleString('tr-TR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
        tr.innerHTML = `
          <td>$${t.entryPrice.toFixed(3)}</td>
          <td>$${t.exitPrice.toFixed(3)}</td>
          <td class="${t.pnl >= 0 ? 'green':'red'}"><b>${t.pnl >= 0 ? '+':''}${formatNum(t.pnl, 2)}%</b></td>
          <td>${t.reason}</td>
        `;
        tTable.appendChild(tr);
      });
    }

    // BAŞLANGIÇ
    loadSavedConfig();
    for (let i = 0; i < 4; i++) {
      loadCoinData(i);
    }

    // 5 SANİYEDE BİR CANLI FİYAT DÖNGÜSÜ
    setInterval(() => {
      coinsConfig.forEach((coin, slotIndex) => {
        if (candlesData[slotIndex] && candlesData[slotIndex].length > 0 && SELECTED_YEAR === '2026') {
          fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${coin.symbol}`)
            .then(res => res.json())
            .then(data => {
              const livePrice = parseFloat(data.price);
              const candles = candlesData[slotIndex];
              candles[candles.length - 1].close = livePrice;
              runBacktestAndRender(slotIndex);
            }).catch(e => console.warn(e));
        }
      });
    }, 5000);
  </script>
</body>
</html>
